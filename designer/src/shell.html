<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="RetroBox Designer: editor offline de interfaces, blocos e exportação Luau."><title>RetroBox Designer · Interface + Ligações</title><style>/*__STYLE__*/</style></head>
<body>
<header><div class="brand"><b class="brand-mark">▣</b><div><strong>RetroBox <em>Designer</em></strong><small data-word="tagline">Monte. Conecte. Exporte.</small></div><span class="version">2.5.1 / API 2</span></div><div class="header-right"><span class="status-dot"></span><span data-word="offline">Funciona offline</span><select id="editor-language" aria-label="Idioma do editor"><option value="pt-BR">Português</option><option value="en-US">English</option></select><button data-action="help" data-word="help">Ajuda</button></div></header>
<nav class="toolbar"><div class="tools"><button data-action="new" data-word="new">Novo</button><button data-action="import" data-word="open">Abrir JSON</button><button data-action="save" data-word="save">Salvar JSON</button></div><div class="tools"><button data-action="undo" title="Ctrl+Z" aria-label="Desfazer">↶</button><button data-action="redo" title="Ctrl+Shift+Z" aria-label="Refazer">↷</button><button data-action="duplicate" data-word="duplicate">Duplicar</button><button data-action="delete" data-word="delete">Excluir</button></div><div class="tools"><select id="device" aria-label="Tamanho da prévia"><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="phone">Celular</option></select><select id="zoom" aria-label="Zoom"><option value=".6">60%</option><option value=".75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select><select id="preview-language" aria-label="Idioma da prévia"><option value="pt-BR">Prévia · PT</option><option value="en-US">Preview · EN</option></select></div><div class="tools end"><button class="drawer-button" data-action="toggle-left" data-word="components">Componentes</button><button class="drawer-button" data-action="toggle-right" data-word="properties">Propriedades</button><button class="test-button" data-action="simulate" data-word="test">▶ Testar</button><button class="primary" data-action="export" data-word="export">Exportar Luau ↗</button></div></nav>
<main class="layout"><aside class="left-panel"><div class="panel-tabs"><button data-left="components" class="active" data-word="components">Componentes</button><button data-left="structure" data-word="structure">Estrutura</button></div><div class="panel-content" id="library-panel"></div></aside><section class="workspace"><div class="workspace-tabs"><button data-view="interface" class="active">Interface</button><button data-view="flow" data-word="connections">Ligações</button><button data-view="translations" data-word="translations">Traduções</button><span id="project-name"></span></div><div id="workspace-body"></div><section id="simulation-console" hidden><div class="console-title"><span data-word="events">Eventos da prévia</span><button data-action="clear-console" data-word="clear">Limpar</button></div><div id="event-log" role="log"></div></section><footer class="workspace-footer"><span id="selection-status"></span><button id="issues-button" data-action="issues"></button></footer></section><aside class="right-panel"><div class="panel-heading"><span data-word="properties">Propriedades</span><button data-action="window-properties" title="Janela">▣</button></div><div class="panel-content" id="inspector"></div></aside></main>
<footer class="app-footer"><span id="save-status" role="status"></span><span data-word="previewNote">Prévia web aproximada · confira no Roblox.</span></footer><div id="toast" role="status" hidden></div><input type="file" id="project-file" accept=".json,application/json" hidden><dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button data-action="close-modal" aria-label="Fechar">×</button></div><div id="modal-content"></div></dialog>
<script id="designer-catalog" type="application/json">/*__CATALOG__*/</script><script id="designer-assets" type="application/json">/*__ASSETS__*/</script><script>/*__CORE__*/</script><script>/*__SIMULATOR__*/</script><script>/*__APP__*/</script></body></html>
